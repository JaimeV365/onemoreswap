# One More Swap — Cloudflare Pages
# Root directory in dashboard = web
# Functions: web/functions → /api/*
#
# Bindings here (dashboard Add is greyed out when wrangler.toml exists).
# Secrets stay in the dashboard only — do NOT also put the same name in [vars]:
#   TURNSTILE_SECRET_KEY
#   TURNSTILE_SITE_KEY   (you already added this as a Secret — that works)

name = "onemoreswap"
pages_build_output_dir = "dist"
compatibility_date = "2025-03-01"

[[d1_databases]]
binding = "DB"
database_name = "onemoreswap"
database_id = "ad1c4fc5-4ca4-46d5-bee2-5d8b7aaeeae3"
