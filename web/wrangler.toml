# One More Swap — Cloudflare Pages
# Root directory in dashboard = web
# Functions: web/functions → /api/*

name = "onemoreswap"
pages_build_output_dir = "dist"
compatibility_date = "2025-03-01"

# Do NOT put TURNSTILE_SITE_KEY here (even empty) — it overrides the
# dashboard Environment variable and blanks the live key.
#
# Set in Pages → Settings → Variables:
#   TURNSTILE_SITE_KEY  (plaintext)
#   TURNSTILE_SECRET_KEY (secret)
#
# D1: bind in the dashboard as DB → database onemoreswap
# (do not add a fake database_id here)
