# One More Swap — Cloudflare Pages
# Root directory in dashboard = web
#
# Dashboard Secrets (only):
#   TURNSTILE_SECRET_KEY
# Do NOT also create a dashboard secret named TURNSTILE_SITE_KEY
# (that clashes with [vars] below and blanks the widget).

name = "onemoreswap"
pages_build_output_dir = "dist"
compatibility_date = "2025-03-01"

[[d1_databases]]
binding = "DB"
database_name = "onemoreswap"
database_id = "ad1c4fc5-4ca4-46d5-bee2-5d8b7aaeeae3"

[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAEk_-dz81cJr7r2D"
